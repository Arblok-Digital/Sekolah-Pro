<!-- partials/broadcast.html — HTML halaman broadcast + modal milik modul broadcast (id/class dipertahankan) -->
<div id="broadcast-page" class="page">
  <div class="page-body" style="max-width:1100px;margin:0 auto;width:100%">

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(135deg,#0d0a1a,#130e24);border:1px solid rgba(192,132,252,.25);border-radius:14px">
      <div style="width:40px;height:40px;border-radius:10px;background:var(--pur-bg);border:1px solid var(--pur);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">📢</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:900;color:var(--pur)">Broadcast Iklan & Pengumuman</div>
        <div style="font-size:10px;color:var(--t3);margin-top:1px">Kirim pesan ke pengguna SekolahPro via Firestore</div>
      </div>
      <span style="background:var(--pur-bg);border:1px solid var(--pur);border-radius:20px;padding:3px 10px;font-size:9px;font-weight:800;color:var(--pur);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0">DEV ONLY</span>
    </div>

    <!-- 2 Kolom: Form (kiri) + Riwayat (kanan) -->
    <div class="bc-cols">

      <!-- KOLOM KIRI: Form -->
      <div class="bc-col-form">
        <div class="card" style="height:100%;box-sizing:border-box">
          <div style="font-size:13px;font-weight:800;color:var(--t1);margin-bottom:14px">✍️ Buat Broadcast Baru</div>

          <!-- Target Penerima -->
          <div style="margin-bottom:14px">
            <div class="fl" style="margin-bottom:6px">Target Penerima</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="bc-tgt" data-t="all"   data-action="setBcTarget" data-args='["@@this"]'>👥 Semua</button>
              <button class="bc-tgt" data-t="admin" data-action="setBcTarget" data-args='["@@this"]'>🔐 Admin</button>
              <button class="bc-tgt" data-t="guru"  data-action="setBcTarget" data-args='["@@this"]'>👨‍🏫 Guru</button>
              <button class="bc-tgt" data-t="ortu"  data-action="setBcTarget" data-args='["@@this"]'>👨‍👩‍👦 Ortu</button>
              <button class="bc-tgt" data-t="siswa" data-action="setBcTarget" data-args='["@@this"]'>🎒 Siswa</button>
            </div>
          </div>

          <!-- Tipe Pesan -->
          <div style="margin-bottom:14px">
            <div class="fl" style="margin-bottom:6px">Tipe Pesan</div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
              <button class="bc-typ" data-y="info"    data-action="setBcType" data-args='["@@this"]'>ℹ️<div style="font-size:9px;margin-top:2px">Info</div></button>
              <button class="bc-typ" data-y="promo"   data-action="setBcType" data-args='["@@this"]'>🎯<div style="font-size:9px;margin-top:2px">Promo</div></button>
              <button class="bc-typ" data-y="warning" data-action="setBcType" data-args='["@@this"]'>⚠️<div style="font-size:9px;margin-top:2px">Peringatan</div></button>
              <button class="bc-typ" data-y="event"   data-action="setBcType" data-args='["@@this"]'>📅<div style="font-size:9px;margin-top:2px">Event</div></button>
            </div>
          </div>

          <!-- Judul -->
          <div style="margin-bottom:10px">
            <div class="fl" style="margin-bottom:4px">Judul *</div>
            <input class="ti" id="bc-title" placeholder="Judul pesan broadcast..." data-action="updateBcPreview"/>
          </div>

          <!-- Isi Pesan -->
          <div style="margin-bottom:10px">
            <div class="fl" style="margin-bottom:4px">Isi Pesan *</div>
            <textarea class="ti" id="bc-body" rows="4" placeholder="Tulis isi pesan di sini... Mendukung emoji 🎉" style="resize:vertical;min-height:90px;line-height:1.6" data-action="updateBcPreview"></textarea>
          </div>

          <!-- CTA -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
            <div>
              <div class="fl" style="margin-bottom:4px">Label Tombol (opsional)</div>
              <input class="ti" id="bc-cta-label" placeholder="Daftar Sekarang..." data-action="updateBcPreview"/>
            </div>
            <div>
              <div class="fl" style="margin-bottom:4px">Link / No. WA</div>
              <input class="ti" id="bc-cta-link" placeholder="https:// atau 628xxx" data-action="updateBcPreview"/>
            </div>
          </div>

          <!-- Preview -->
          <div style="margin-bottom:16px">
            <div class="fl" style="margin-bottom:6px">Preview Pesan</div>
            <div id="bc-preview-box" style="background:var(--s2);border:1px solid var(--bdr);border-radius:10px;padding:14px;min-height:60px;transition:border-color .2s">
              <div id="bc-preview-inner" style="color:var(--t3);font-size:11px;font-style:italic">Mulai ketik judul untuk preview...</div>
            </div>
          </div>

          <!-- Kirim -->
          <button data-action="kirimBroadcastDev" style="
            width:100%;padding:13px;border-radius:10px;border:none;
            background:linear-gradient(135deg,#7c3aed,#4f46e5);
            color:#fff;font-size:13px;font-weight:900;cursor:pointer;
            display:flex;align-items:center;justify-content:center;gap:8px;
            transition:opacity .15s;" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
            📢 Kirim Broadcast ke Firestore
          </button>
        </div>
      </div><!-- /bc-col-form -->

      <!-- KOLOM KANAN: Riwayat -->
      <div class="bc-col-history">
        <div class="card" style="padding:0;overflow:hidden;height:100%;box-sizing:border-box;display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid var(--bdr);flex-shrink:0">
            <div style="font-size:13px;font-weight:800;color:var(--t1)">📋 Riwayat Broadcast</div>
            <button data-action="syncBroadcastsFromFirestore" style="
              background:var(--cyn-bg);color:var(--cyn);border:1px solid var(--cyn);
              border-radius:7px;padding:5px 12px;font-size:10px;font-weight:700;cursor:pointer">
              🔄 Sync
            </button>
          </div>
          <div id="bc-history-list" style="
            flex:1;
            overflow-y:auto;
            overflow-x:hidden;
            -webkit-overflow-scrolling:touch;
            scrollbar-width:thin;
            scrollbar-color:var(--bdr2) transparent;
            padding:12px 16px;
          ">
            <div class="empty-state"><span class="empty-icon">📭</span><span class="empty-text">Belum ada broadcast</span></div>
          </div>
        </div>
      </div><!-- /bc-col-history -->

    </div><!-- /bc-cols -->

  </div><!-- /page-body -->
</div>
