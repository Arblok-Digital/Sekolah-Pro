<!-- partials/alumni.html — HTML halaman alumni + modal milik modul alumni (id/class dipertahankan) -->
<div id="alumni-page" class="page">
  <div class="page-body">
    <div class="stats-row">
      <div class="sc"><div class="sc-l">🎓 Total Alumni</div><div class="sc-v" id="al-stat-total">0</div><div class="sc-s">Terdaftar</div></div>
      <div class="sc"><div class="sc-l">📅 Angkatan</div><div class="sc-v" id="al-stat-angkatan" style="color:var(--pur)">0</div><div class="sc-s">Tahun berbeda</div></div>
      <div class="sc"><div class="sc-l">📊 Rata Nilai</div><div class="sc-v" id="al-stat-nilai" style="color:var(--cyn)">—</div><div class="sc-s">Kelulusan</div></div>
      <div class="sc"><div class="sc-l">📍 Terlacak</div><div class="sc-v" id="al-stat-terlacak" style="color:var(--grn)">0</div><div class="sc-s">Status jelas</div></div>
    </div>

    <div class="card">
      <div class="toolbar" style="gap:8px;flex-wrap:wrap">
        <button class="abtn abtn-p" data-action="openModal" data-args='["modal-alumni-add"]'>+ Tambah Alumni</button>
        <button class="abtn abtn-g" data-action="luluskanSiswa">🎓 Luluskan Siswa Kelas 6</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title" style="flex-wrap:wrap;gap:8px">
        <span>🎓 Data Alumni</span>
        <select class="ts" id="al-filter-angkatan" style="font-size:12px" data-action="renderAlumni">
          <option value="">Semua Angkatan</option>
        </select>
      </div>
      <div id="alumni-list">
        <div class="empty-state"><span class="empty-icon">🎓</span><span class="empty-text">Belum ada data alumni</span></div>
      </div>
    </div>

    <!-- Statistik Kelulusan -->
    <div class="card">
      <div class="card-title">📊 Statistik Kelulusan</div>
      <div id="al-statistik"></div>
    </div>
  </div>
</div>

<!-- MODALS -->
<div id="modal-alumni-add" class="modal-bg">
  <div class="sheet">
    <div class="mhdr"><h2>🎓 Tambah Alumni</h2><button class="mclose" data-action="closeModal" data-args='["modal-alumni-add"]'>✕</button></div>
    <div class="msec">
      <div class="fg" style="gap:10px">
        <div class="inp-group fg-full">
          <div class="fl">Nama Lengkap*</div>
          <input class="ti" id="al-nama-inp" placeholder="Nama alumni..."/>
        </div>
        <div class="inp-group">
          <div class="fl">NISN</div>
          <input class="ti" id="al-nisn-inp" placeholder="0012345678"/>
        </div>
        <div class="inp-group">
          <div class="fl">Tahun Lulus</div>
          <input class="ti" id="al-tahun-inp" type="number" placeholder="2024"/>
        </div>
        <div class="inp-group">
          <div class="fl">Nilai Rata-rata</div>
          <input class="ti" id="al-nilai-inp" type="number" placeholder="85.5" min="0" max="100" step="0.1"/>
        </div>
        <div class="inp-group fg-full">
          <div class="fl">Sekolah Lanjutan (SMP/MTs)</div>
          <input class="ti" id="al-sekolah-inp" placeholder="SMP Negeri 1..."/>
        </div>
        <div class="inp-group fg-full">
          <div class="fl">Status Saat Ini</div>
          <select class="ts" id="al-status-inp">
            <option value="lanjut">✅ Melanjutkan ke SMP/MTs</option>
            <option value="bekerja">💼 Bekerja</option>
            <option value="tidak-diketahui">❓ Tidak Diketahui</option>
          </select>
        </div>
        <div class="inp-group fg-full">
          <div class="fl">Prestasi / Catatan</div>
          <input class="ti" id="al-prestasi-inp" placeholder="Juara olimpiade, beasiswa..."/>
        </div>
      </div>
    </div>
    <div class="mact">
      <button class="mbtn mbtn-c" data-action="closeModal" data-args='["modal-alumni-add"]'>Batal</button>
      <button class="mbtn mbtn-s" data-action="simpanAlumni">✅ Simpan Alumni</button>
    </div>
  </div>
</div>
